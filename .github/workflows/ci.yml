name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt
      - name: Linter (ruff, reglas E, F, B y S)
        run: ruff check .
      - name: Pruebas y cobertura de calculo.py
        run: pytest --cov=calculo --cov-branch --cov-fail-under=90
      - name: Auditoría de dependencias
        run: pip-audit -r requirements-dev.txt
