[project]
name = "calculadora-notas"
version = "0.1.0"
description = "Calcula la nota final ponderada a partir de notas y porcentajes"
requires-python = ">=3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E: estilo, F: errores, B: errores probables (bugbear), S: seguridad (bandit)
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# En pytest, assert es la forma normal de comprobar un resultado
"test_*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
